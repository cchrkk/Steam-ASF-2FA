name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download latest ASF (generic) as build reference
        run: |
          set -euo pipefail
          tag=$(curl -fsSL https://api.github.com/repos/JustArchiNET/ArchiSteamFarm/releases/latest | jq -r .tag_name)
          echo "Building against ASF $tag"
          curl -fsSL -o asf.zip "https://github.com/JustArchiNET/ArchiSteamFarm/releases/download/${tag}/ASF-generic.zip"
          mkdir -p asf
          unzip -q asf.zip -d asf

      - name: Build plugin
        run: dotnet build QrLoginApprover -c Release

  app:
    name: App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 34
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build app
        working-directory: app-android
        run: ./gradlew :app:assembleDebug --no-daemon