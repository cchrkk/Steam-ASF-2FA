name: Release

# - schedule (daily) / manual  -> builds against the latest ASF; skips if that ASF was already released
# - tag push (e.g. 2.0.6)      -> releases exactly that version
# - manual with a version input-> releases that version (hotfixes)
#
# Version is independent of ASF (2.0.<run number>) so every build is a new version; the release notes state which
# ArchiSteamFarm version it was built against and list the changes since the previous release.

on:
  push:
    tags: ['*.*.*.*']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (optional; e.g. 2.0.6). Leave empty to use the automatic one.'
        required: false
        type: string

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  PLUGIN_PROJECT: QrLoginApprover
  PLUGIN_NAME: SteamASF2FA
  PLUGIN_TFM: net10.0
  APP_DIR: app-android
  APP_NAME: SteamASF2FA

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version and target ASF
        id: resolve
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          asf=$(curl -fsSL https://api.github.com/repos/JustArchiNET/ArchiSteamFarm/releases/latest | jq -r .tag_name)
          skip=false

          if [ -n "${DISPATCH_VERSION:-}" ]; then
            version="${DISPATCH_VERSION}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
          else
            last=$(cat ASF_VERSION 2>/dev/null || true)
            if [ "${asf}" = "${last}" ]; then
              skip=true
            fi
            version="2.0.${GITHUB_RUN_NUMBER}"
          fi

          code=$(( 100000000 + GITHUB_RUN_NUMBER ))

          echo "ASF ${asf}  ->  version ${version}  (code ${code}, skip ${skip})"
          {
            echo "version=${version}"
            echo "asf=${asf}"
            echo "code=${code}"
            echo "skip=${skip}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: steps.resolve.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Install Android SDK 34
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure app signing
        if: steps.resolve.outputs.skip != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Download ASF (generic) as build reference
        if: steps.resolve.outputs.skip != 'true'
        env:
          ASF: ${{ steps.resolve.outputs.asf }}
        run: |
          set -euo pipefail
          curl -fsSL -o asf.zip "https://github.com/JustArchiNET/ArchiSteamFarm/releases/download/${ASF}/ASF-generic.zip"
          mkdir -p asf
          unzip -q asf.zip -d asf

      - name: Build plugin
        if: steps.resolve.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: dotnet build "$PLUGIN_PROJECT" -c Release -p:Version="$VERSION"

      - name: Package plugin
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p out
          cp "${PLUGIN_PROJECT}/bin/Release/${PLUGIN_TFM}/${PLUGIN_NAME}.dll" out/
          (cd out && zip -qr "../${PLUGIN_NAME}.zip" .)

      - name: Build Android app
        if: steps.resolve.outputs.skip != 'true'
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          CODE: ${{ steps.resolve.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"

      - name: Package app
        if: steps.resolve.outputs.skip != 'true'
        run: cp "${APP_DIR}/app/build/outputs/apk/release/app-release.apk" "${APP_NAME}.apk"

      - name: Checksums
        if: steps.resolve.outputs.skip != 'true'
        run: sha256sum "${PLUGIN_NAME}.zip" "${APP_NAME}.apk" > SHA256SUMS

      - name: Build release notes
        if: steps.resolve.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          ASF: ${{ steps.resolve.outputs.asf }}
        run: |
          set -euo pipefail

          prev=$(git tag --sort=-v:refname | grep -v -x "${VERSION}" | head -n1 || true)
          if [ -n "${prev}" ]; then
            changes=$(git log --no-merges --pretty='- %s' "${prev}..HEAD" || true)
          else
            changes=$(git log --no-merges --pretty='- %s' -15 || true)
          fi
          if [ -z "${changes}" ]; then
            changes="- Rebuilt against a new ArchiSteamFarm release."
          fi

          printf '%s\n' \
            '<p align="center"><img src="https://raw.githubusercontent.com/cchrkk/Steam-ASF-2FA/main/docs/logo.png" width="112" alt="Steam ASF 2FA"></p>' \
            '' \
            "# Steam ASF 2FA ${VERSION}" \
            '' \
            "**Compatible with ArchiSteamFarm \`${ASF}\`** — plugin and app built against it." \
            '' \
            '## Changes' \
            "${changes}" \
            '' \
            '## Notes' \
            '- ⚠️ **Vibe-coded** — built with heavy AI assistance. Review it before trusting it with your accounts.' \
            '- 🔒 **Use it on your LAN.** Point the app at ASF'"'"'s LAN IP (`192.168.x.x:1242`), not a public address.' \
            '- ✅ Verify downloads with `SHA256SUMS` (both assets are listed there).' \
            '' \
            '## Assets' \
            '- `SteamASF2FA.zip` — ASF plugin; unpack into `plugins/SteamASF2FA/`.' \
            '- `SteamASF2FA.apk` — Android app.' \
            '- `SHA256SUMS` — SHA-256 of both assets.' \
            > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release
        if: steps.resolve.outputs.skip != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.resolve.outputs.version }}
          name: Steam ASF 2FA ${{ steps.resolve.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.PLUGIN_NAME }}.zip
            ${{ env.APP_NAME }}.apk
            SHA256SUMS

      - name: Record built ASF version
        if: steps.resolve.outputs.skip != 'true'
        env:
          ASF: ${{ steps.resolve.outputs.asf }}
        run: |
          set -euo pipefail
          echo "${ASF}" > ASF_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ASF_VERSION
          git diff --cached --quiet || git commit -m "Track ArchiSteamFarm ${ASF}"
          git push
